[tool.poetry]
name = "classbot"
version = "0.1.0"
description = "classbot"
authors = ["2711402357@qq.com"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"
nonebot2 = {extras = ["fastapi"], version = "^2.0.0"}
pandas = "^1.0.0"
httpx = "^0.27.2"
aiomysql = "^0.2.0"
fastapi = "^0.115.4"
imgkit = "^1.2.3"
jinja2 = "^3.1.4"
markdown2 = "^2.5.1"
cryptography = "^43.0.3"
nonebot-adapter-qq = "^1.5.3"
nonebot-plugin-orm = "^0.7.6"
nonebot-plugin-alconna = "^0.53.1"
nonebot-plugin-animeres = "^1.0.4"
nonebot-plugin-localstore = "^0.7.1"
nonebot-plugin-blockwords = "^0.2.1"
nonebot-plugin-apscheduler = "^0.5.0"
strenum = "^0.4.15"
cos-python-sdk-v5 = "^1.9.26"
anyio = ">=3.7,<4.0"
xlrd = "^2.0.1"
nonebot-plugin-htmlrender = "^0.2.2"
aiosqlite = "^0.20.0"
pydantic = "^1.10.0"

[tool.poetry.group.dev.dependencies]
pycln = "^2.3.0"
black = "^23.10.1"
isort = "^5.12.0"
pre-commit = "^3.5.0"
autoflake = "^2.2.0"


[tool.poetry.group.test.dependencies]
pytest-asyncio = "^0.21.1"
nonebug = "^0.3.5"

[[tool.poetry.source]]
name = "tencent"
url = "https://mirrors.cloud.tencent.com/pypi/simple"
priority = "primary"

[tool.nonebot]
plugins = [
    "nonebot_plugin_orm",
    "nonebot_plugin_alconna",
    "nonebot_plugin_animeres",
    # "nonebot_plugin_blockwords",
    "nonebot_plugin_localstore",
    "nonebot_plugin_apscheduler",
    # "utils.models",
]
plugin_dirs = [
    "src/managers",
    "src/plugins",
    "src/others",
]
adapters = [
    {name = "QQ", module_name = "nonebot.adapters.qq"},
]

[tool.black]
line-length = 88
target-version = ["py38", "py39", "py310", "py311"]
include = '\.pyi?$'
extend-exclude = '''
'''

[tool.isort]
profile = "black"
line_length = 88
length_sort = true
skip_gitignore = true
force_sort_within_sections = true
src_paths = ["nonebot", "tests"]
extra_standard_library = ["typing_extensions"]

[tool.pycln]
path = "."
all = false

[build-system]
requires = ["poetry_core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
