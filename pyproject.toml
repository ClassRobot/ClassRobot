[tool.poetry]
name = "classbot"
version = "0.1.0"
description = "classbot"
authors = ["2711402357@qq.com"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"
nonebot2 = {extras = ["fastapi"], version = "^2.4.1"}
pandas = "^2.2.3"
httpx = "^0.28.1"
aiomysql = "^0.2.0"
fastapi = "^0.115.8"
imgkit = "^1.2.3"
markdown2 = "^2.5.3"
cryptography = "^44.0.0"
nonebot-adapter-qq = "^1.6.2"
nonebot-plugin-orm = {extras = ["postgresql", "asyncpg"], version = "^0.7.6"}
nonebot-plugin-alconna = "^0.54.2"
nonebot-plugin-animeres = "^1.0.5"
nonebot-plugin-localstore = "^0.7.3"
nonebot-plugin-blockwords = "^0.2.1"
nonebot-plugin-apscheduler = "^0.5.0"
strenum = "^0.4.15"
cos-python-sdk-v5 = "^1.9.33"
xlrd = "^2.0.1"
aiosqlite = "^0.21.0"
pydantic = "^1.10.0"
nonebot-adapter-onebot = "^2.4.6"
nonebot-plugin-htmlrender = "^0.5.1"
openai = "^1.61.0"
aioredis = "^2.0.1"
nonebot-plugin-status = "^0.9.0"
nonebot-plugin-waiter = "^0.8.1"

[tool.poetry.group.dev.dependencies]
pycln = "^2.4.0"
black = "^23.10.1"
isort = "^5.13.2"
pre-commit = "^3.5.0"
autoflake = "^2.3.1"


[tool.poetry.group.test.dependencies]
pytest-asyncio = "^0.25.1"
nonebug = "^0.4.3"

[[tool.poetry.source]]
name = "tencent"
url = "https://mirrors.cloud.tencent.com/pypi/simple"
priority = "primary"

[tool.nonebot]
plugins = [
    "nonebot_plugin_alconna",
    "nonebot_plugin_orm",
    "nonebot_plugin_htmlrender",
    "nonebot_plugin_animeres",
    "nonebot_plugin_localstore",
    "nonebot_plugin_apscheduler",
    "nonebot_plugin_status",
    "nonebot_plugin_waiter",
    "utils.models",
]
plugin_dirs = [
    "src/managers",
    "src/plugins",
    "src/others",
]
adapters = [
    {name = "QQ", module_name = "nonebot.adapters.qq"},
    {name = "OneBot V11", module_name = "nonebot.adapters.onebot.v11"},
    {name = "OneBot V12", module_name = "nonebot.adapters.onebot.v12"},
    {name = "Ntchat", module_name = "nonebot.adapters.ntchat"},
]

[tool.black]
line-length = 88
target-version = ["py38", "py39", "py310", "py311"]
include = '\.pyi?$'
extend-exclude = '''
'''

[tool.isort]
profile = "black"
line_length = 88
length_sort = true
skip_gitignore = true
force_sort_within_sections = true
src_paths = ["nonebot", "tests"]
extra_standard_library = ["typing_extensions"]

[tool.pycln]
path = "."
all = true

[build-system]
requires = ["poetry_core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
