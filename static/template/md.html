<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>课程表视图</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        
    </style>
</head>

<body>

    <div class="page-wrapper">

        <header class="top-bar">
            <div class="date-info">
                <div class="year-week">2025 第 8 教学周</div>
                <div class="day-date">
                    <span class="date-number">04</span>
                    <span class="date-details">02日<br>星期三</span>
                </div>
            </div>
            <div class="countdown">
                <div>距离下节课</div>
                <div class="timer">
                    <i class="far fa-clock"></i> 00:30:00
                </div>
            </div>
        </header>

        <section class="next-class-info">
            <div class="section-title">下节课</div>
            <h2>数据结构与算法</h2>
            <p><i class="fas fa-user icon"></i> 周伟林</p>
            <p><i class="fas fa-map-marker-alt icon"></i> 吉时雨培训中心 203 通讯实验室</p>
        </section>

        <section class="daily-schedule">
            <div class="section-title">今日课程</div>
            <div class="class-item">
                <h3>数据结构与算法分析</h3>
                <div class="class-details">
                    <span>伍梦斌</span>
                    <span>08:00 - 09:40</span>
                </div>
                <p class="location">二教 406 室</p>
            </div>
            <div class="class-item">
                <h3>大学生就业指导</h3>
                <div class="class-details">
                    <span>伍梦斌</span>
                    <span>10:05 - 10:50</span>
                </div>
                <p class="location">二教 214 室</p>
            </div>
        </section>

        <section class="weekly-schedule">
            <div class="section-title">本周课程</div>
            <div class="schedule-grid">
                <div class="day-header">M</div>
                <div class="day-header">T</div>
                <div class="day-header active-day">W</div>
                <div class="day-header">T</div>
                <div class="day-header">F</div>
                <div class="day-header">S</div>
                <div class="day-header">S</div>

                <div class="day-cell"></div>
                <div class="day-cell"></div>
                <div class="day-cell">
                    <div class="scheduled-item">数据结构与算法分析<br>2-406</div>
                    <div class="scheduled-item">大学生就业指导<br>2-214</div>
                </div>
                <div class="day-cell"></div>
                <div class="day-cell">
                    <div class="scheduled-item">系统性能分析与优化<br>216</div>
                </div>
                <div class="day-cell"></div>
                <div class="day-cell"></div>

                <div class="day-cell"></div>
                <div class="day-cell"></div>
                <div class="day-cell"></div>
                <div class="day-cell"></div>
                <div class="day-cell tall-cell"></div>
                <div class="day-cell"></div>
                <div class="day-cell"></div>
            </div>
        </section>

    </div>

</body>

</html>
