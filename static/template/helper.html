<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            font-family: "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Hiragino Sans GB", "Heiti SC", "Microsoft YaHei", "WenQuanYi Micro Hei", sans-serif;
        }

        body {
            width: 1200px;
            padding: 1em;
        }

        li {
            list-style: none;
        }

        /** 横线 */
        hr {
            height: 3px;
            background-color: rgba(128, 128, 128, 0.3);
            margin: .5em 0;
            border: none;
        }

        .helpers {
            display: flex;
            flex-wrap: wrap;
            gap: 1em;
        }

        .helpers .card {
            flex: 1 1 calc(33.333% - 1em);
            box-sizing: border-box;
            min-height: 100px;
            background-color: antiquewhite;
            padding: 1em;
            border-radius: .5em;
        }

        .box {
            display: flex;
            gap: 1em;
        }

        .description,
        .params {
            min-height: 100px;
        }

        .description {
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 5;
            line-clamp: 5;
            -webkit-box-orient: vertical;
            flex: 1 1 auto;
            border-right: 3px solid rgba(128, 128, 128, 0.3);
            padding-right: .5em;
        }

        .params {
            flex: 0 0 100px; /* Fixed size for params */
        }
        .params * {
            word-wrap: break-word;
        }
    </style>
</head>

<body>
    {% if helper %}






    {% elif helpers %}
    <div class="helpers">
        {% for data in helpers %}
        <div class="card">
            <h2>{{ data.command }}</h2>
            <hr>
            <div class="box">
                <div class="description">
                    {% for text in data.description.split("\n") %}
                    <p>{{ text.replace(" ", "&nbsp;") }}</p>
                    {% endfor %}
                </div>
                <div class="params">
                    <h3>参数</h3>
                    <ul>
                        {% for param in data.params %}
                        <li>{{ param }}</li>
                        {% endfor %}
                    </ul>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
    {% endif %}

</body>

</html>
