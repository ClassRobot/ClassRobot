repos:
  - repo: https://github.com/PyCQA/autoflake
    rev: v2.2.1
    hooks:
      - id: autoflake
        args:
          [
            "--remove-all-unused-imports",
            "--ignore-init-module-imports",
            "--remove-unused-variables",
          ]
        stages: [pre-commit]

  - repo: https://github.com/pycqa/isort
    rev: 5.12.0
    hooks:
      - id: isort
        args: ["--profile", "black"]
        stages: [pre-commit]

  - repo: https://github.com/psf/black
    rev: 23.10.1
    hooks:
      - id: black
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: mypy-agents
        name: mypy agents
        entry: mypy --follow-imports=skip --ignore-missing-imports utils/llm/agents/agent.py utils/llm/agents/schema.py utils/llm/agents/tool.py utils/llm/agents/tools.py utils/llm/agents/profiles.py utils/llm/agents/domestic.py utils/llm/agents/ragflow/client.py src/plugins/autogpt/__init__.py src/plugins/autogpt/command_tools.py src/plugins/autogpt/pipeline.py src/plugins/autogpt/schema.py src/plugins/autogpt/util.py
        language: python
        language_version: python3.12
        additional_dependencies: ["mypy==1.18.2"]
        pass_filenames: false
        files: ^(utils/llm/agents/(agent|schema|tool|tools|profiles|domestic)|utils/llm/agents/ragflow/client|src/plugins/autogpt/(__init__|command_tools|pipeline|schema|util))\.py$
        stages: [pre-commit]

  - repo: https://github.com/python-poetry/poetry
    rev: 1.6.0
    hooks:
      - id: poetry-export
        name: poetry export
        entry: poetry
        args: ["export", "-f", "requirements.txt", "--output", "requirements.txt"]
        stages: [pre-commit]

exclude: ^(migrations|include)/
