repos:
  - repo: https://github.com/PyCQA/autoflake
    rev: v2.4.0
    hooks:
      - id: autoflake
        args:
          [
            "--remove-all-unused-imports",
            "--ignore-init-module-imports",
            "--remove-unused-variables",
          ]
        stages: [pre-commit]

  - repo: https://github.com/pycqa/isort
    rev: 9.0.1
    hooks:
      - id: isort
        args: ["--profile", "black"]
        stages: [pre-commit]

  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 26.5.1
    hooks:
      - id: black
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: poetry-sync
        name: poetry sync
        entry: python scripts/sync_poetry_lock.py
        language: python
        language_version: python3.12
        additional_dependencies: ["poetry==2.3.4", "poetry-plugin-export>=1.8,<2.0"]
        files: ^(pyproject\.toml|poetry\.lock)$
        stages: [pre-commit]

      - id: mypy-agents
        name: mypy agents
        entry: mypy --follow-imports=skip --ignore-missing-imports core/llm/__init__.py core/llm/config.py core/llm/gateway.py core/llm/message.py core/llm/typings.py core/llm/util.py core/llm/session.py core/llm/functools.py core/llm/exceptions.py core/agent/base.py core/agent/agent.py core/agent/schema.py core/agent/tool.py core/agent/profiles.py core/agent/domestic.py core/agent/builtin/conversation.py core/agent/builtin/multimodal.py core/agent/builtin/planning.py core/agent/builtin/retrieval.py core/agent/ragflow/client.py core/agent/runtime/__init__.py core/agent/runtime/command_tools.py core/agent/runtime/knowledge.py core/agent/runtime/node_registry.py core/agent/runtime/orchestration_config.py core/agent/runtime/pipeline.py core/agent/runtime/playbooks.py core/agent/runtime/schema.py core/agent/runtime/util.py core/agent/runtime/workflow.py core/agent/runtime/coordination/state.py core/agent/runtime/coordination/nodes.py core/agent/runtime/persistence/checkpoints.py core/agent/runtime/persistence/runs.py core/storage/local_rag.py src/features/autogpt/__init__.py
        language: python
        language_version: python3.12
        additional_dependencies: ["mypy==1.18.2"]
        pass_filenames: false
        files: ^(core/llm/.*|core/agent/.*|core/storage/local_rag\.py|src/features/autogpt/__init__\.py)$
        stages: [pre-commit]

      - id: pyright-pylance
        name: pyright pylance diagnostics
        entry: python scripts/run_pyright_pylance.py -p pyrightconfig.json
        language: system
        pass_filenames: false
        files: ^(core/llm/.*|core/agent/.*|core/storage/local_rag\.py|src/features/autogpt/__init__\.py|src/interfaces/http/managers/(agent/.*|api/agents\.py|router\.py))$
        stages: [pre-commit]

exclude: ^(migrations|include)/
