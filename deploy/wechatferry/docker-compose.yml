name: classrobot-wechatferry

services:
  wechatferry:
    image: ${WCF_IMAGE:-jackytj/wcf-docker:latest}
    container_name: ${WCF_CONTAINER_NAME:-classrobot-wechatferry}
    restart: unless-stopped
    shm_size: ${WCF_SHM_SIZE:-1g}
    ports:
      - "${WCF_VNC_PORT:-8088}:8080"
      - "${WCF_API_PORT:-8000}:8000"
    volumes:
      - ./data/wechat:/home/app/wechat
    environment:
      CALLBACK_URL: ${WCF_CALLBACK_URL:-}
      TZ: ${TZ:-Asia/Shanghai}
